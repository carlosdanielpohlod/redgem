    <linearGradient id="rg-f3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0375c"/><stop offset="1" stop-color="#c2143f"/></linearGradient>
    <linearGradient id="rg-f4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b40f39"/><stop offset="1" stop-color="#8a0a2d"/></linearGradient>
    <linearGradient id="rg-f5" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cc1643"/><stop offset="1" stop-color="#8f0b2f"/></linearGradient>
    <linearGradient id="rg-f6" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8f0b2f"/><stop offset="1" stop-color="#5e061f"/></linearGradient>
