<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" role="img" aria-label="RedGem 3D Engine">
  <defs>
    <clipPath id="l-wire"><polygon points="0,0 68,0 50,120 0,120"/></clipPath>
    <clipPath id="l-solid"><polygon points="68,0 120,0 120,120 50,120"/></clipPath>
  </defs>
  <!-- A ruby, half wireframe and half rendered: what a 3D engine does. -->
  <g clip-path="url(#l-wire)" fill="none" stroke="#ff5a74" stroke-width="2.6" stroke-linejoin="round"><polygon points="10,46 36,18 44,46"/><polygon points="36,18 84,18 76,46 44,46"/><polygon points="84,18 110,46 76,46"/><polygon points="10,46 44,46 60,108"/><polygon points="44,46 76,46 60,108"/><polygon points="76,46 110,46 60,108"/></g>
  <g clip-path="url(#l-solid)"><polygon points="10,46 36,18 44,46" fill="#ff8fa0"/><polygon points="36,18 84,18 76,46 44,46" fill="#ffd0d7"/><polygon points="84,18 110,46 76,46" fill="#b40f39"/><polygon points="10,46 44,46 60,108" fill="#f0375c"/><polygon points="44,46 76,46 60,108" fill="#e3204b"/><polygon points="76,46 110,46 60,108" fill="#7a0928"/></g>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" transform="skewX(-9)">
    <text x="152" y="76" font-size="80" font-weight="900" letter-spacing="-3"><tspan fill="#f7f3f4">RED</tspan><tspan fill="#f0375c">GEM</tspan></text>
  </g>
  <text x="142" y="106" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="13.5" fill="#a8979d">3D ENGINE</text>
</svg>
