    <linearGradient id="rg-word" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8fa0"/><stop offset="0.55" stop-color="#f0375c"/><stop offset="1" stop-color="#b40f39"/></linearGradient>\n  </defs>
  <!-- A ruby seen from above. Its table, the flat facet on top, is a play button. -->
  <polygon points="120,64 92,112.5 36,112.5 8,64 36,15.5 92,15.5" fill="#5e061f" stroke="#5e061f" stroke-width="9" stroke-linejoin="round"/>
  <g stroke="#ffe3e8" stroke-opacity="0.28" stroke-width="0.9" stroke-linejoin="round">
    <polygon points="36,15.5 92,15.5 46,38" fill="url(#rg-f1)"/>
    <polygon points="92,15.5 92,64 46,38" fill="url(#rg-f2)"/>
    <polygon points="92,15.5 120,64 92,64" fill="url(#rg-f3)"/>
    <polygon points="120,64 92,112.5 92,64" fill="url(#rg-f4)"/>
    <polygon points="92,112.5 46,90 92,64" fill="url(#rg-f5)"/>
    <polygon points="92,112.5 36,112.5 46,90" fill="url(#rg-f6)"/>
    <polygon points="36,112.5 8,64 46,90" fill="url(#rg-f7)"/>
    <polygon points="8,64 46,38 46,90" fill="url(#rg-f8)"/>
    <polygon points="8,64 36,15.5 46,38" fill="url(#rg-f9)"/>
  </g>
  <polygon class="rg-play" points="46,38 92,64 46,90" fill="url(#rg-play)" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round"/>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="150" y="78" font-size="74" font-weight="800" letter-spacing="-3.2"><tspan fill="#f7f3f4">Red</tspan><tspan fill="url(#rg-word)">Gem</tspan></text>
    <text x="154" y="110" font-size="17" font-weight="600" letter-spacing="10" fill="#a8979d">GAME ENGINE</text>
  </g>
