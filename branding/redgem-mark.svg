<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="RedGem">
  <!-- A cut ruby seen from the side: crown above the girdle, pavilion below. Light from the upper left. -->
  <g stroke="#3b0613" stroke-width="1.2" stroke-linejoin="round">
    <polygon points="10,46 38,20 35,46" fill="#ff5d73"/>
    <polygon points="38,20 60,46 35,46" fill="#ff8fa0"/>
    <polygon points="38,20 82,20 60,46" fill="#ffc2cb"/>
    <polygon points="82,20 85,46 60,46" fill="#f43f5e"/>
    <polygon points="82,20 110,46 85,46" fill="#c81e3f"/>
    <polygon points="10,46 35,46 60,110" fill="#e11d48"/>
    <polygon points="35,46 60,46 60,110" fill="#f6506b"/>
    <polygon points="60,46 85,46 60,110" fill="#b3123a"/>
    <polygon points="85,46 110,46 60,110" fill="#7d0b2a"/>
  </g>
</svg>
