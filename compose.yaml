# tools/docker/editor.sh             opens the editor on your X11 display, as your own user
# docker compose run --rm test       runs the whole test suite (no display needed)
# docker compose up relay            runs a meeting point for multiplayer games (port 7778)
# docker compose up server           runs a game on a dedicated server (port 7777; GAME=<folder> picks it)
services:
  # Started by tools/docker/editor.sh, which adds your user, your games folder and your settings.
  editor:
    build: .
    image: redgem
    environment:
      DISPLAY: ${DISPLAY:-:0}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./games:/redgem/games   # the demos of this checkout
    devices:
      - /dev/dri:/dev/dri
    command: build/src/redgem

  test:
    build: .
    image: redgem
    init: true  # xvfb-run waits for a signal that never reaches process 1
    environment:
      LIBGL_ALWAYS_SOFTWARE: "1"
    command: xvfb-run -a -s "-screen 0 1600x900x24" ctest --test-dir build --output-on-failure

  # Where games played over the internet meet (see the manual's Multiplayer page).
  # It faces the internet, so it runs as nobody in particular, with none of root's powers, no way
  # to gain any, and nothing it can write to: all a relay does is pass messages on.
  relay:
    build: .
    image: redgem
    init: true
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "7778:7778"
    command: build/src/redgem-relay

  # A game run on a dedicated server, for players to join (see the manual's Dedicated server page):
  # the platformer demo unless GAME names another game's folder. Like the relay, it runs with no
  # powers; the one place it writes to is its data volume, where the game's saves are kept.
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        GAME: ${GAME:-games/platformer}
    image: redgem-server
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "7777:7777"
    volumes:
      - server-data:/data

volumes:
  server-data:
