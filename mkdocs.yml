site_name: RedGem 3D Engine
site_description: The manual of RedGem, a 3D game engine where games are written in Ruby.
site_url: https://carlosdanielpohlod.github.io/redgem-site/manual/
docs_dir: docs
theme:
  name: material
  logo: assets/redgem-mark.svg
  favicon: assets/redgem-mark.svg
  palette:
    scheme: slate
    primary: custom
    accent: custom
  font: false
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy
extra_css:
  - assets/manual.css
# llms.txt and llms-full.txt, beside the built site: the manual for coding assistants.
hooks:
  - tools/docs/llms_txt.py
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
nav:
  - Home: index.md
  - Getting started:
      - Install: install.md
      - Your first game: first-game.md
  - Using the editor:
      - The editor: editor.md
      - Prefab files: prefabs.md
      - Levels, lighting and Blender: levels.md
      - The command line: command-line.md
      - Making games with an AI assistant: assistants.md
      - MCP tools: mcp.md
  - Scripting in Ruby:
      - Behaviours: scripting/behaviours.md
      - Gameplay recipes: scripting/gameplay.md
      - Multiplayer: scripting/multiplayer.md
      - Online services: scripting/online-services.md
      - Texts in several languages: scripting/i18n.md
      - API reference: scripting/api.md
  - Finishing a game:
      - Testing your game: testing.md
      - Building and sharing: shipping.md
      - Dedicated server: dedicated-server.md
  - Limits and troubleshooting: troubleshooting.md
  - Working on the engine: contributing.md
