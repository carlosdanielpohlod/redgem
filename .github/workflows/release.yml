# The downloads of a release, built and packed here rather than by hand: the two Linux ones (a
# tarball and an AppImage of the same files, with the players for Windows and Android in
# bin/runtimes/) and the Windows one on Linux, with the pinned llvm-mingw and Android NDK, and the
# two Mac ones on Macs of each kind. The Linux programs are built on Ubuntu 22.04 with libstdc++
# linked in, so that they run on glibc 2.35 and later systems (LINUX_GLIBC_FLOOR in
# tools/release/release_files.sh), and are run again on an older system than that. Each download
# is checked before it is kept (its list of files, and its programs run on its own system). Then
# all five are checked together, and a release never gets fewer than five.
#
# What starts it, and what it does with the downloads (tools/release/plan_release.sh decides):
# * a pushed tag v<version>: attached to that tag's draft release, which is made when missing.
#   Only a tag's run touches a release, so a draft only ever holds downloads built from its tag;
# * a pull request from a release-<version> branch, or a run started by hand: kept as the run's
#   artifacts only, to try them before tagging.
# A pull request is built from its head, not its merge with main. The plan fails before anything
# is built when the tag or the release branch does not name the version in CMakeLists.txt, or
# when that version's release is published already. A release is never published here: the
# owner publishes the draft. A published release is never changed (attach_to_draft.sh).
name: Release

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

# A newer push to a pull request makes the run of the older one pointless. Other runs share no
# group (their run's id): a tag's run is never cancelled, nor left pending behind another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    name: What is released
    # (Every other pull request skips the whole workflow.)
    if: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'release-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      commit: ${{ steps.plan.outputs.commit }}
      attach: ${{ steps.plan.outputs.attach }}
    steps:
      # (A pull request's head: what the other jobs build, and its CMakeLists.txt.)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Decide the tag, and whether a release is touched
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.head_ref }}
        # (bash, not the default: with pipefail, a tag that is not the version fails here.)
        shell: bash
        run: tools/release/plan_release.sh | tee -a "${GITHUB_OUTPUT}"

      # Hours of builds for a release that can no longer take them are not started. (A run by
      # hand only keeps artifacts: it may rebuild a published version.)
      - name: Check that the release is not published already
        if: ${{ github.ref_type == 'tag' || github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          state="$(tools/release/release_state.sh "${TAG}")"
          echo "The release ${TAG} is ${state}."
          if [[ "${state}" == "published" ]]; then
            echo "::error::The release ${TAG} is published already: bump the version in CMakeLists.txt."
            exit 1
          fi

  # The Linux programs, on an older system than the runners' so that the downloads run on older
  # systems too: what they take from glibc is what Ubuntu 22.04 has (2.35). Its GCC 12 is newer
  # than its default compiler; libstdc++ is linked into the programs (REDGEM_STATIC_LIBSTDCXX), so
  # they need no libstdc++ of the system's. (libgcc stays shared: every glibc system has libgcc_s, and
  # linking it in would bring in GCC's unwinder, which needs glibc 2.35's _dl_find_object.)
  linux-build:
    name: Linux programs (Ubuntu 22.04)
    needs: plan
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:22.04@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11
    # (About 15 minutes with its compiler cache; an hour without it.)
    timeout-minutes: 90
    env:
      DEBIAN_FRONTEND: noninteractive
      CC: gcc-12
      CXX: g++-12
      CCACHE_MAXSIZE: 1G
      # Ubuntu 22.04's CMake is older than the 3.24 the engine needs: Kitware's, pinned.
      CMAKE_VERSION: "3.31.8"
      CMAKE_SHA256: "630615d8e98ac33eba7fbe472626dff5c899c85af3c024585ae109166a6909d0"
    steps:
      # The engine's own list (docs/install.md), with GCC 12, Ruby and rake from Ubuntu, and curl
      # for CMake. (git first: the checkout is a repository, which packing the demos reads.)
      - name: Install the build tools and libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            gcc-12 g++-12 libc6-dev make ninja-build git ca-certificates curl xz-utils bison ruby \
            rake ccache zstd libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxext-dev libxfixes-dev libxrender-dev libasound2-dev

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false

      - name: Install CMake
        run: |
          archive="cmake-${CMAKE_VERSION}-linux-x86_64"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${archive}.tar.gz" \
            "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/${archive}.tar.gz"
          echo "${CMAKE_SHA256}  ${RUNNER_TEMP}/${archive}.tar.gz" | sha256sum --check -
          tar -xzf "${RUNNER_TEMP}/${archive}.tar.gz" -C /opt
          echo "/opt/${archive}/bin" >> "${GITHUB_PATH}"

      # (In a container the workspace has the container's path, which github.workspace is not.)
      - name: Place the caches
        run: |
          echo "CCACHE_DIR=${GITHUB_WORKSPACE}/.ccache" >> "${GITHUB_ENV}"
          echo "FETCH_DIR=${GITHUB_WORKSPACE}/.deps/fetch" >> "${GITHUB_ENV}"

      - name: Describe the toolchain
        run: |
          grep PRETTY_NAME /etc/os-release
          ldd --version | head -n 1
          "${CXX}" --version | head -n 1
          cmake --version | head -n 1
          ruby --version

      # Its own caches, under names no other workflow's restore-keys match: no other workflow
      # builds with this compiler, nor fetches the libraries' sources at this path.
      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-ubuntu22-linux-${{ github.run_id }}
          restore-keys: ccache-ubuntu22-linux-

      - name: Restore the libraries' sources
        id: fetch-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .deps/fetch/*-src
            .deps/fetch/*-subbuild
          key: fetch-ubuntu22-linux-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/PatchGlfwForMac.cmake') }}

      # (Warnings are the Linux workflow's to fail on, with the compiler the engine is written with.)
      - name: Build the Linux programs
        id: build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DREDGEM_BUILD_TESTS=OFF \
            -DREDGEM_STATIC_LIBSTDCXX=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DFETCHCONTENT_BASE_DIR="${FETCH_DIR}" -DFETCHCONTENT_UPDATES_DISCONNECTED=ON
          ccache --zero-stats
          cmake --build build --target redgem redgem_player redgem_relay redgem_server redgem_test_tool
          ccache --show-stats

      # (Even when the build failed: what it compiled is still good.)
      - name: Keep the compiler cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-ubuntu22-linux-${{ github.run_id }}

      - name: Keep the libraries' sources
        if: ${{ steps.fetch-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            .deps/fetch/*-src
            .deps/fetch/*-subbuild
          key: ${{ steps.fetch-cache.outputs.cache-primary-key }}

      # (In a tarball: an artifact keeps no file's permission to run.)
      - name: Pack the Linux programs
        run: |
          tar -czf linux-programs.tar.gz -C build/src redgem redgem-player redgem-relay redgem-server redgem-test

      - name: Keep the Linux programs
        uses: actions/upload-artifact@v4
        with:
          name: linux-programs
          path: linux-programs.tar.gz
          if-no-files-found: error
          retention-days: 1

  linux-windows:
    name: Linux and Windows downloads
    needs: [plan, linux-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false

      # The engine's own list (docs/install.md), ccache, and zip for the Windows download.
      - name: Install the build tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git ca-certificates xz-utils bison ccache zip unzip \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxext-dev libxfixes-dev libxrender-dev libasound2-dev
          echo "/usr/lib/ccache" >> "${GITHUB_PATH}"

      # rake builds mruby, for each system.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Describe the toolchain
        run: |
          lsb_release -ds
          cc --version | head -n 1
          cmake --version | head -n 1
          ruby --version

      # Where the players for other systems go beside them (build/src/runtimes/).
      - name: Take the Linux programs
        uses: actions/download-artifact@v4
        with:
          name: linux-programs
          path: ${{ runner.temp }}

      - name: Unpack the Linux programs
        run: |
          mkdir -p build/src
          tar -xzf "${RUNNER_TEMP}/linux-programs.tar.gz" -C build/src

      # With the llvm-mingw release tools/windows/fetch_toolchain.sh pins: the player into
      # build/src/runtimes/windows/, then the editor and the servers of the Windows download.
      - name: Build the Windows programs
        run: |
          tools/windows/build_runtime.sh
          cmake --build build-windows --target redgem redgem_relay redgem_server

      - name: Restore the NDK
        uses: actions/cache/restore@v4
        with:
          path: .deps/android-ndk
          key: android-ndk-${{ hashFiles('tools/android/fetch_toolchain.sh') }}

      - name: Restore the Android compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-android-${{ github.run_id }}
          restore-keys: ccache-android-

      - name: Restore the Android libraries' sources
        uses: actions/cache/restore@v4
        with:
          path: |
            build-android/*/_deps/*-src
            build-android/*/_deps/*-subbuild
          key: fetch-android-${{ hashFiles('cmake/Dependencies.cmake') }}

      # With the NDK release tools/android/fetch_toolchain.sh pins (fetched when not restored).
      - name: Build the Android players
        env:
          REDGEM_ANDROID_CMAKE_ARGS: >-
            -DFETCHCONTENT_UPDATES_DISCONNECTED=ON
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            -DREDGEM_WARNINGS_AS_ERRORS=ON
        run: tools/android/build_runtime.sh arm64-v8a x86_64

      # (With the AppImage: appimagetool and its runtime, pinned by tools/release/fetch_appimage_tools.sh.)
      - name: Pack the downloads
        run: tools/release/package.sh

      # The newest glibc version the Linux programs take a symbol of, against what the docs say.
      # (bash, not the default: with pipefail, a floor above the docs' fails here.)
      - name: Measure the Linux programs' glibc floor
        shell: bash
        run: |
          tools/release/glibc_floor.sh build/src/redgem build/src/redgem-player build/src/redgem-relay \
            build/src/redgem-server build/src/redgem-test | tee "${RUNNER_TEMP}/glibc-floor.txt"
          {
            echo "### glibc floor of the Linux programs"
            echo '```'
            cat "${RUNNER_TEMP}/glibc-floor.txt"
            echo '```'
            echo "AppImage: $(stat -c %s dist/release/redgem-linux-x86_64.AppImage) bytes"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Check what the downloads hold
        run: |
          tools/release/check_downloads.sh dist/release \
            redgem-linux-x86_64.tar.gz redgem-linux-x86_64.AppImage redgem-windows-x86_64.zip

      - name: Run the Linux downloads' programs
        run: |
          tools/release/smoke_test.sh dist/release/redgem-linux-x86_64.tar.gz
          tools/release/smoke_test.sh dist/release/redgem-linux-x86_64.AppImage

      - name: Keep the Linux download
        uses: actions/upload-artifact@v4
        with:
          name: redgem-linux-x86_64
          path: dist/release/redgem-linux-x86_64.tar.gz
          if-no-files-found: error

      # (Packed already: an AppImage is compressed inside.)
      - name: Keep the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: redgem-linux-x86_64-appimage
          path: dist/release/redgem-linux-x86_64.AppImage
          if-no-files-found: error
          compression-level: 0

      - name: Keep the Windows download
        uses: actions/upload-artifact@v4
        with:
          name: redgem-windows-x86_64
          path: dist/release/redgem-windows-x86_64.zip
          if-no-files-found: error

  # The Linux downloads on a system older than the one they are built on: AlmaLinux 9, whose glibc
  # (2.34) every update of it keeps. The programs run, a demo is checked and built, and what they
  # and the built game take from glibc is measured again (tools/release/smoke_test.sh). It has the
  # libraries a desktop has (X11, OpenGL, ALSA), and no FUSE: the AppImage unpacks itself to run.
  linux-old-system:
    name: Linux downloads run on an older system
    needs: [plan, linux-windows]
    runs-on: ubuntu-24.04
    container:
      image: almalinux:9@sha256:245f8aab832fe800aa42bdab5fad75ebbd8e0b4c9f24820a83c638b177857ae2
    timeout-minutes: 20
    steps:
      - name: Install what a desktop has, and objdump
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            tar gzip findutils binutils libX11 libXrandr libXinerama libXcursor libXi libXext \
            mesa-libGL alsa-lib

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: redgem-linux-x86_64*
          path: dist/release
          merge-multiple: true

      - name: Describe the system
        run: |
          grep PRETTY_NAME /etc/os-release
          ldd --version | head -n 1

      - name: Run the Linux downloads' programs
        run: |
          tools/release/smoke_test.sh dist/release/redgem-linux-x86_64.tar.gz
          tools/release/smoke_test.sh dist/release/redgem-linux-x86_64.AppImage

  # The Windows download is packed on Linux: its programs are run here, on Windows.
  windows-check:
    name: Windows download runs
    needs: [plan, linux-windows]
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: redgem-windows-x86_64
          path: dist/release

      - name: Run the Windows download's programs
        run: tools/release/smoke_test.sh dist/release/redgem-windows-x86_64.zip

  macos:
    name: Mac download (${{ matrix.arch }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    env:
      # The oldest macOS the programs run on (written into the app's Info.plist as well).
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false

      - uses: ./.github/actions/macos-build-tools

      - name: Describe the toolchain
        run: |
          sw_vers
          bash --version | head -n 1
          uname -m
          xcodebuild -version
          cmake --version | head -n 1
          ruby --version

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DREDGEM_WARNINGS_AS_ERRORS=ON \
            -DREDGEM_BUILD_TESTS=OFF
          cmake --build build --target redgem redgem_player redgem_relay redgem_server redgem_test_tool

      - name: Pack the download
        run: tools/release/package.sh

      - name: Check what the download holds
        run: tools/release/check_downloads.sh dist/release redgem-macos-${{ matrix.arch }}.zip

      - name: Run the download's programs
        run: tools/release/smoke_test.sh dist/release/redgem-macos-${{ matrix.arch }}.zip

      - name: Keep the download
        uses: actions/upload-artifact@v4
        with:
          name: redgem-macos-${{ matrix.arch }}
          path: dist/release/redgem-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

      # As a double click does: through the system's launcher, with no game named (the project hub).
      # A picture for a person to look at, not a check: a screen capture that fails on the
      # runner does not hold back the download.
      - name: Open the packed app and take a picture of the screen
        continue-on-error: true
        run: |
          unpacked="${RUNNER_TEMP}/unpacked"
          mkdir -p "${unpacked}"
          ditto -x -k "dist/release/redgem-macos-${{ matrix.arch }}.zip" "${unpacked}"
          tools/macos/capture_window.sh "dist/screens/app-hub-${{ matrix.arch }}.png" 30 \
            open -W -n "${unpacked}/redgem/RedGem.app"
          pkill -x redgem || true

      - name: Keep the picture of the app
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: app-hub-${{ matrix.arch }}
          path: dist/screens
          if-no-files-found: warn

  # Runs even when a job above failed, to say which download is missing.
  gather:
    name: All five downloads
    needs: [plan, linux-build, linux-windows, linux-old-system, windows-check, macos]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: redgem-*
          path: dist/release
          merge-multiple: true

      - name: Check that all five are there and hold what they must
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          tools/release/check_downloads.sh dist/release
          {
            echo "### Downloads for ${TAG}"
            echo '```'
            (cd dist/release && sha256sum -- *)
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      # (A download can be there and still have failed a check: the Windows one runs apart.)
      - name: Check that every build and check passed
        if: ${{ !cancelled() }}
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"${RESULTS}"
          jq -e 'all(.[]; .result == "success")' <<<"${RESULTS}" > /dev/null || {
            echo "Not every job above passed: no release gets these downloads." >&2
            exit 1
          }

  attach:
    name: Attach to the draft release
    needs: [plan, gather]
    # (Only a pushed tag's run: nothing else writes its draft. No concurrency group, which would
    # cancel a pending attach: attach_to_draft.sh swaps the downloads in only once all five are
    # up, and checks the result.)
    if: ${{ needs.plan.outputs.attach == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The only job that may write: it makes or changes the draft release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: redgem-*
          path: dist/release
          merge-multiple: true

      - name: Attach the downloads to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: tools/release/attach_to_draft.sh "${TAG}" "${COMMIT}" dist/release
