# The player for Android (libredgem.so), built for phones (arm64-v8a) and emulators (x86_64) with
# the NDK release tools/android/fetch_toolchain.sh pins, by tools/android/build_runtime.sh as a
# developer builds it. Nothing is run (there is no phone, and no emulator): this catches code that
# only breaks the Android build, which no other run compiles.
name: Android

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes the run of the older one pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Android player (arm64-v8a, x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v4

      - name: Install the build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache unzip

      # rake builds mruby (for this machine first: its own tools, then for each processor).
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      # (About two gigabytes unpacked: downloaded once per release of the script.)
      - name: Restore the NDK
        id: ndk-cache
        uses: actions/cache/restore@v4
        with:
          path: .deps/android-ndk
          key: android-ndk-${{ hashFiles('tools/android/fetch_toolchain.sh') }}

      - name: Fetch the NDK
        if: ${{ steps.ndk-cache.outputs.cache-hit != 'true' }}
        run: tools/android/fetch_toolchain.sh

      - name: Keep the NDK
        if: ${{ steps.ndk-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .deps/android-ndk
          key: ${{ steps.ndk-cache.outputs.cache-primary-key }}

      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-android-${{ github.run_id }}
          restore-keys: ccache-android-

      # (Each processor's build keeps its own: what CMake configures in them differs.)
      - name: Restore the libraries' sources
        id: fetch-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build-android/*/_deps/*-src
            build-android/*/_deps/*-subbuild
          key: fetch-android-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Build the player for both processors
        id: build
        env:
          REDGEM_ANDROID_CMAKE_ARGS: >-
            -DFETCHCONTENT_UPDATES_DISCONNECTED=ON
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        run: |
          ccache --zero-stats
          tools/android/build_runtime.sh arm64-v8a x86_64
          ccache --show-stats
          ls -l build/src/runtimes/android/*/libredgem.so

      # (Only after a build that worked: one cut short may have half of them.)
      - name: Keep the libraries' sources
        if: ${{ steps.build.outcome == 'success' && steps.fetch-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            build-android/*/_deps/*-src
            build-android/*/_deps/*-subbuild
          key: ${{ steps.fetch-cache.outputs.cache-primary-key }}

      # (Even when the build failed: what it compiled is still good. From main only: the
      # repository's caches are shared, and one per pull request push would crowd out the rest.)
      - name: Keep the compiler cache
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-android-${{ github.run_id }}
