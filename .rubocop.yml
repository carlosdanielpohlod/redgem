# What `tools/lint.sh` holds the Ruby to: the engine's prelude, the games' scripts and the tests.
# Scripts run on mruby inside the engine, so files do not start with magic comments and classes
# load by name instead of by `require`.
AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2
  SuggestExtensions: false
  Exclude:
    - 'build/**/*'
    - 'build-*/**/*'
    - '.deps/**/*'
    - '.private/**/*'
    - 'tests/fixtures/**/*'      # some are broken on purpose
    - 'tests/ruby_failing/**/*'
    - 'tests/system_failing/**/*'

# Small methods that do one thing, with logic that reads top to bottom.
Metrics/MethodLength:
  Max: 8
  CountAsOne: ['array', 'hash', 'heredoc', 'method_call']
Metrics/AbcSize:
  Max: 20
Metrics/CyclomaticComplexity:
  Max: 5
Metrics/PerceivedComplexity:
  Max: 5
Metrics/ClassLength:
  Max: 180
Metrics/ModuleLength:
  Max: 200
Metrics/ParameterLists:
  Max: 5
  CountKeywordArgs: false
Metrics/BlockLength:
  Exclude:
    - 'tests/**/*'               # a system test is one block that plays the game

Layout/LineLength:
  Max: 120

# mruby has no frozen-string magic comment, and scripts are found by class name.
Style/FrozenStringLiteralComment:
  Enabled: false
Style/Documentation:
  Enabled: false                 # every script starts with a comment saying what it is for
Style/GlobalVars:
  Exclude:
    - 'tests/**/*'               # tests watch the game through globals
    - 'ruby/engine/system_test.rb'
# Engine entry points are named __like_this so they cannot clash with a game's methods.
Naming/MethodName:
  AllowedPatterns: ['\A__']
Naming/PredicateMethod:
  Enabled: false
Naming/FileName:
  Enabled: true
Style/NumericLiterals:
  Enabled: true

# The code's own habits.
Style/StringLiterals:
  EnforcedStyle: double_quotes
Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
Layout/ExtraSpacing:
  AllowBeforeTrailingComments: true   # constants' comments are lined up
# Coordinates, colors and time steps go by the letters everyone knows them by.
Naming/MethodParameterName:
  AllowedNames: [x, y, z, r, g, b, a, t, dt, to, id]
# Arithmetic is written as in a formula: * and / before + and -.
Lint/AmbiguousOperatorPrecedence:
  Enabled: false
# A behaviour's `update(dt)` returns nothing in particular, whatever its last line is.
Style/CommentedKeyword:
  Enabled: false
